name: Автотесты

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.13"

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установить зависимости
        run: python -m pip install "charset-normalizer>=3.3,<4"

      - name: Проверить синтаксис
        run: python -m py_compile bundle.py tests/test_wildcard_paths.py

      - name: Запустить тесты
        run: python -m unittest discover -s tests -v
