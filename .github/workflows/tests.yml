name: Автотесты

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "charset-normalizer>=3.3,<4"
      - name: Проверить синтаксис
        run: python -m compileall -q bundle.py bundle_model.py bundle_paths.py bundle_git.py bundle_select.py bundle_writer.py bundle_serialize.py bundle_output.py tests
      - name: Запустить тесты
        run: python -m unittest discover -s tests -v
